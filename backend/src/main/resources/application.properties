spring.application.name=tasktimetracker
# DB????
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# MyBatis????????
mybatis.configuration.map-underscore-to-camel-case=true
# ????????????????
server.servlet.context-path=/api
# TIMESTAMP型として保存された日時をAPIレスポンスへ変換するときのDBタイムゾーン
app.database-time-zone=${DATABASE_TIME_ZONE:Asia/Tokyo}
# ブラウザからAPIへのアクセスを許可するオリジン（複数指定はカンマ区切り）
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
