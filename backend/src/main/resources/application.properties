spring.application.name=tasktimetracker
# DB????
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Spring Session??????????????PostgreSQL?DDL?????
spring.session.jdbc.initialize-schema=never
# ????????30?????????????30??????
spring.session.store-type=jdbc
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.max-age=30d
# Railway????????????Spring Framework?????????
server.forward-headers-strategy=framework
# MyBatis????????
mybatis.configuration.map-underscore-to-camel-case=true
# ????????????????
server.servlet.context-path=/api
# TIMESTAMP????????????API?????????????DB??????
app.database-time-zone=${DATABASE_TIME_ZONE:Asia/Tokyo}
# ??????API????????????????????????????
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
# ??????????????IP??????????????
app.security.rate-limit.login.maximum-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:10}
app.security.rate-limit.login.window=${LOGIN_RATE_LIMIT_WINDOW:15m}
# ????Railway Variables?SPRINGDOC_ENABLED?false???
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
# ?????????URL???????????????Host??????????
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
# ?????????MAIL_DELIVERY=resend???????
app.mail.delivery=${MAIL_DELIVERY:stdout}
app.mail.api-url=${MAIL_API_URL:https://api.resend.com/emails}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from=${MAIL_FROM:Task Time Tracker <noreply@notify.kibori-saway.com>}
app.mail.connect-timeout=${MAIL_CONNECT_TIMEOUT:3s}
app.mail.read-timeout=${MAIL_READ_TIMEOUT:10s}
# メールアドレス確認・変更トークンの有効期限
app.auth.email-verification.token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:24h}
app.auth.email-change.token-ttl=${EMAIL_CHANGE_TOKEN_TTL:24h}
app.auth.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
# 期限切れ・使用済みトークンの定期削除（デフォルト毎日3時）
app.auth.token-cleanup.cron=${TOKEN_CLEANUP_CRON:0 0 3 * * *}
# 新規レート制限（仕様書14章）
app.security.rate-limit.registration.maximum-attempts=${REGISTRATION_RATE_LIMIT_MAX:5}
app.security.rate-limit.registration.window=${REGISTRATION_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.password-reset-request-email.maximum-attempts=${PASSWORD_RESET_REQUEST_EMAIL_RATE_LIMIT_MAX:5}
app.security.rate-limit.password-reset-request-email.window=${PASSWORD_RESET_REQUEST_EMAIL_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.password-reset-request-ip.maximum-attempts=${PASSWORD_RESET_REQUEST_IP_RATE_LIMIT_MAX:20}
app.security.rate-limit.password-reset-request-ip.window=${PASSWORD_RESET_REQUEST_IP_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.password-reset-confirm.maximum-failures=${PASSWORD_RESET_CONFIRM_RATE_LIMIT_MAX:10}
app.security.rate-limit.password-reset-confirm.window=${PASSWORD_RESET_CONFIRM_RATE_LIMIT_WINDOW:15m}
app.security.rate-limit.email-verification-resend.maximum-attempts=${EMAIL_VERIFICATION_RESEND_RATE_LIMIT_MAX:5}
app.security.rate-limit.email-verification-resend.window=${EMAIL_VERIFICATION_RESEND_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.email-verification-confirm.maximum-failures=${EMAIL_VERIFICATION_CONFIRM_RATE_LIMIT_MAX:10}
app.security.rate-limit.email-verification-confirm.window=${EMAIL_VERIFICATION_CONFIRM_RATE_LIMIT_WINDOW:15m}
app.security.rate-limit.email-change-request.maximum-attempts=${EMAIL_CHANGE_REQUEST_RATE_LIMIT_MAX:5}
app.security.rate-limit.email-change-request.window=${EMAIL_CHANGE_REQUEST_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.email-change-confirm.maximum-failures=${EMAIL_CHANGE_CONFIRM_RATE_LIMIT_MAX:10}
app.security.rate-limit.email-change-confirm.window=${EMAIL_CHANGE_CONFIRM_RATE_LIMIT_WINDOW:15m}
