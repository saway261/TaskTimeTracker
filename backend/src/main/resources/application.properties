spring.application.name=tasktimetracker
# DB????
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Spring Sessionのテーブルはデプロイ前に公式PostgreSQL用DDLで作成する
spring.session.jdbc.initialize-schema=never
# 匿名セッションは30分、認証成功後はコード側で30日に延長する
spring.session.store-type=jdbc
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.max-age=30d
# Railwayの信頼済みプロキシ情報はSpring Frameworkを経由して解釈する
server.forward-headers-strategy=framework
# MyBatis????????
mybatis.configuration.map-underscore-to-camel-case=true
# ????????????????
server.servlet.context-path=/api
# TIMESTAMP型として保存された日時をAPIレスポンスへ変換するときのDBタイムゾーン
app.database-time-zone=${DATABASE_TIME_ZONE:Asia/Tokyo}
# ブラウザからAPIへのアクセスを許可するオリジン（複数指定はカンマ区切り）
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
# 認証失敗のレート制限（送信元IPと正規化メールの組み合わせ）
app.security.rate-limit.login.maximum-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:10}
app.security.rate-limit.login.window=${LOGIN_RATE_LIMIT_WINDOW:15m}
# 本番ではRailway VariablesのSPRINGDOC_ENABLEDをfalseにする
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
