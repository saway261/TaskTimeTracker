spring.application.name=tasktimetracker
spring.sql.init.mode=always
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.test.database.replace=none
spring.h2.console.enabled=true
spring.session.jdbc.initialize-schema=always
spring.session.store-type=jdbc
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=false
mybatis.configuration.map-underscore-to-camel-case=true
# 既存の統合テストが意図せず新規レート制限に触れないよう、テストのデフォルトは大きな値にする。
# 個々のレート制限テストは@SpringBootTest(properties=...)で対象の値だけを下げて検証する。
app.security.rate-limit.registration.maximum-attempts=1000
app.security.rate-limit.password-reset-request-email.maximum-attempts=1000
app.security.rate-limit.password-reset-request-ip.maximum-attempts=1000
app.security.rate-limit.password-reset-confirm.maximum-failures=1000
app.security.rate-limit.email-verification-resend.maximum-attempts=1000
app.security.rate-limit.email-verification-confirm.maximum-failures=1000
app.security.rate-limit.email-change-request.maximum-attempts=1000
app.security.rate-limit.email-change-confirm.maximum-failures=1000
