<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Vueマウント前にdata-themeを設定し、初期表示のちらつきを防ぐ（フェーズ7 §7.1）。
      // 決定順はsrc/theme.tsのgetInitialTheme()と同じにすること。
      (function () {
        var stored = localStorage.getItem('ttt-theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/ttt-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Time Tracker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
